name: Pruebas y ejecutables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas de la API (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: secreto-de-pruebas-en-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Crear la BD (lo mismo que hace el sistema al arrancar)
        run: npm start -- --no-abrir --puerto 3000 & sleep 15 && curl -sf http://localhost:3000/api/salud
      - run: npm test

  ejecutables:
    name: Ejecutables (${{ matrix.destino }})
    needs: pruebas
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        destino: [windows-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run ejecutables -- ${{ matrix.destino }}
      - uses: actions/upload-artifact@v4
        with:
          name: inventario-${{ matrix.destino }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publicar:
    name: Publicar Release
    needs: ejecutables
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Sistema de Inventario ${{ github.ref_name }}
          files: dist/*
          body: |
            Descarga el archivo de tu sistema, descomprímelo y ejecútalo:

            - **Windows:** `inventario-…-windows-x64.zip` → doble clic en `inventario.exe`
            - **Linux (PC):** `inventario-…-linux-x64.tar.gz` → `./inventario`
            - **Linux ARM (Raspberry Pi):** `inventario-…-linux-arm64.tar.gz` → `./inventario`

            Requisito: MySQL 8.0.16+ o MariaDB 10.6+ encendido. La primera vez pregunta los datos de conexión y crea la base de datos sola.
            Usuarios de prueba: `admin@inventario.local` / `Admin123*` y `almacen@inventario.local` / `Almacen123*`.
