name: Pruebas y ejecutables

# - Cada push y pull request: pruebas de la API contra MySQL 8.
# - Cuando en main hay una versión nueva en package.json (sin release todavía),
#   o al subir una etiqueta v*: genera los ejecutables y publica el Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas de la API (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: secreto-de-pruebas-en-ci
    outputs:
      version: ${{ steps.version.outputs.version }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Crear la BD (lo mismo que hace el sistema al arrancar)
        run: npm start -- --no-abrir --puerto 3000 & sleep 15 && curl -sf http://localhost:3000/api/salud
      - run: npm test
      - name: ¿Hay versión nueva para publicar?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]] \
               && ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

  ejecutables:
    name: Ejecutables (${{ matrix.destino }})
    needs: pruebas
    if: needs.pruebas.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        destino: [windows-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run ejecutables -- ${{ matrix.destino }}
      - uses: actions/upload-artifact@v4
        with:
          name: inventario-${{ matrix.destino }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publicar:
    name: Publicar Release
    needs: [pruebas, ejecutables]
    if: needs.pruebas.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.pruebas.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sistema de Inventario v${{ needs.pruebas.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            Descarga el archivo de tu sistema, descomprímelo y ejecútalo:

            - **Windows:** `inventario-…-windows-x64.zip` → doble clic en `inventario.exe`
            - **Linux (PC):** `inventario-…-linux-x64.tar.gz` → `./inventario`
            - **Linux ARM (Raspberry Pi):** `inventario-…-linux-arm64.tar.gz` → `./inventario`

            Requisito: MySQL 8.0.16+ o MariaDB 10.6+ encendido. La primera vez pregunta los datos de conexión y crea la base de datos sola.
            Usuarios de prueba: `admin@inventario.local` / `Admin123*` y `almacen@inventario.local` / `Almacen123*`.

            Instrucciones completas y solución de problemas: ver el README del repositorio.
